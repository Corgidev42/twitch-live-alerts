name: Alerte live Twitch

on:
  schedule:
    - cron: "2-59/5 * * * *"  # décalé de :00 (heures de pointe GitHub)
  workflow_dispatch:
    inputs:
      test:
        description: "Poster une carte de test (sans ping) puis la supprimer"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le live
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TWITCH_LOGIN: mantate_
          PING_ROLE_ID: "1575117681592508548"
          TEST_MODE: ${{ inputs.test && '1' || '0' }}
        run: python3 check_live.py
      - name: Sauvegarder l'état
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "état du live"
            git pull --rebase -q origin main  # le bot a pu écrire l'état entre-temps
            git push
          fi
